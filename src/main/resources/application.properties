spring.application.name=TicketManagement

spring.datasource.url=jdbc:mysql://localhost:3306/ticket_management
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Thymeleaf template cache for local development
spring.thymeleaf.cache=false

# Disable static asset caching
spring.web.resources.chain.cache=false

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.chat.options.num-predict=150
spring.ai.ollama.chat.options.num-ctx=1024
spring.ai.ollama.chat.options.temperature=0.3